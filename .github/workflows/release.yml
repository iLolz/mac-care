name: Release

# Builds an unsigned (ad-hoc signed) universal Mac Care.app and packages it as .zip and .dmg.
# - Pull requests that touch the build: packages only, uploaded as a workflow artifact.
# - Tags like v0.1.0: packages and publishes a GitHub Release with both files attached.
# - Manual runs with a version (e.g. 0.1.0): same as a tag; the release creates tag v<version>
#   on the commit that was built. Without a version, a manual run only uploads the artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "project.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release (universal, ad-hoc signed)
        run: >
          xcodebuild -project MacCare.xcodeproj -scheme MacCare
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build
          ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO
          MARKETING_VERSION="${{ steps.version.outputs.version }}"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM=""
          build

      - name: Package .zip and .dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="build/Build/Products/Release/Mac Care.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -info "$app/Contents/MacOS/Mac Care"

          mkdir -p dist dmg
          ditto -c -k --keepParent "$app" "dist/MacCare-$VERSION.zip"

          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Mac Care" -srcfolder dmg -ov -format UDZO "dist/MacCare-$VERSION.dmg"

          cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacCare-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >
          gh release create "$TAG" dist/*
          --target "$GITHUB_SHA"
          --title "Mac Care $TAG"
          --generate-notes
          --notes "Unsigned build (ad-hoc signed, not notarized). See the README for how to open it the first time."
